// ============================================================
const routes = {
  '/': renderHome,
  '/projects': renderProjects,
  '/pr': renderPR,
  '/rep': renderRep,
  '/social': renderSocial
};

function navigate(path) {
  history.pushState({}, '', path);
  renderRoute();
}

window.addEventListener('popstate', renderRoute);

function renderRoute() {
  const path = window.location.pathname.replace(/\/$/, '') || '/';
  const handler = routes[path] || renderNotFound;
  handler();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// intercept clicks on internal links
document.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  const href = a.getAttribute('href');
  if (href && href.startsWith('/') && !href.startsWith('//') && !a.getAttribute('target')) {
    e.preventDefault();
    navigate(href);
  }
});

function renderPR() {

  document.getElementById('app').innerHTML = `
    <a href="/" class="back-link">← на главную</a>
    <div class="page-title">🔀 Мои Pull Requests</div>
    <div id="pr-container">

    </div>
  `;

}

async function fetchPullRequests() {
  const container = document.getElementById('pr-container');
  if (!container) return;

  // GitHub Search API: find PRs authored by florestdev
  const query = encodeURIComponent('is:pr author:florestdev');
  const url = `https://api.github.com/search/issues?q=${query}&sort=created&order=desc&per_page=20`;

  try {
    const res = await fetch(url, {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });

    if (!res.ok) {
      if (res.status === 403) {
        container.innerHTML = '<div class="error-msg">⚠️ GitHub API rate limit exceeded. Попробуйте позже.</div>';
      } else {
        container.innerHTML = `<div class="error-msg">⚠️ Ошибка загрузки: ${res.status}</div>`;
      }
      return;
    }

    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      container.innerHTML = '<div class="loading">Пул-реквестов пока нет.</div>';
      return;
    }

    const items = data.items.map(pr => {
      const repoMatch = pr.repository_url.match(/repos\/(.+)$/);
      const repoName = repoMatch ? repoMatch[1] : 'unknown';
      const stateIcon = pr.state === 'open' ? '🟢' : '🔴';
      return `
        <div class="pr-item">
          <a href="${pr.html_url}" target="_blank" rel="noopener">
            ${stateIcon} #${pr.number} — ${escapeHtml(pr.title)}
          </a>
          <div class="pr-repo">${escapeHtml(repoName)} · ${new Date(pr.created_at).toLocaleDateString('ru-RU')}</div>
        </div>
      `;
    }).join('');

    container.innerHTML = `<div class="pr-list">${items}</div>`;
  } catch (err) {
    container.innerHTML = '<div class="error-msg">⚠️ Не удалось загрузить пул-реквесты. Проверьте подключение.</div>';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
